name: Export strict lint validation
on:
  push:
    branches: [validation/export-lint-oct30]
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.14
          cache: yarn
      - run: yarn --immutable
      - run: yarn build
        working-directory: packages/apollo-shared
      - run: yarn eslint --max-warnings 0
      - run: yarn typecheck:node
